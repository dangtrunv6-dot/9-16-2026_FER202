<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FER202 - Exercise 7: Cards Columns</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <style>
    /* Bo góc nhẹ cho hình ảnh bên trong card */
    .card-img-container {
      padding: 15px 15px 0 15px;
    }
  </style>
</head>
<body class="p-4">

  <div class="container-fluid">
    <h2 class="mb-4">Cards Columns</h2>

    <div class="row g-4">
      <!-- Card 1: Blue -->
      <div class="col-md-4">
        <div class="card bg-primary text-white text-center h-100 border-0">
          <div class="card-img-container">
            <img src="https://placehold.co/600x350/white/000?text=Car+Image" class="card-img-top bg-white rounded-1" alt="Car">
          </div>
          <div class="card-body d-flex align-items-center justify-content-center py-2">
            <p class="card-text mb-0">Some text inside the first card</p>
          </div>
        </div>
      </div>

      <!-- Card 2: Yellow / Warning -->
      <div class="col-md-4">
        <div class="card bg-warning text-dark text-center h-100 border-0">
          <div class="card-img-container">
            <img src="https://placehold.co/600x350/white/000?text=Car+Image" class="card-img-top bg-white rounded-1" alt="Car">
          </div>
          <div class="card-body d-flex align-items-center justify-content-center py-2">
            <p class="card-text mb-0">Some text inside the first card</p>
          </div>
        </div>
      </div>

      <!-- Card 3: Red / Danger -->
      <div class="col-md-4">
        <div class="card bg-danger text-white text-center h-100 border-0">
          <div class="card-img-container">
            <img src="https://placehold.co/600x350/white/000?text=Car+Image" class="card-img-top bg-white rounded-1" alt="Car">
          </div>
          <div class="card-body d-flex align-items-center justify-content-center py-2">
            <p class="card-text mb-0">Some text inside the first card</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
