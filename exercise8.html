<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 8 - Form đặt vé máy bay</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    .form-container {
      max-width: 550px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-light">

  <div class="form-container shadow-sm border">
    <!-- Alert thanh thông báo phía trên -->
    <div class="alert alert-warning alert-dismissible fade show mb-3" role="alert">
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Tiêu đề h1 -->
    <h1 class="fw-bold mb-4">Form đặt vé máy bay</h1>

    <form>
      <!-- Họ tên (Input group với Prepend & Append) -->
      <div class="mb-3">
        <label for="fullName" class="form-label text-secondary">Họ tên</label>
        <div class="input-group">
          <span class="input-group-text bg-white text-muted">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" class="form-control" id="fullName" placeholder="Họ tên">
          <span class="input-group-text bg-light text-muted">vnđ</span>
        </div>
        <div class="form-text text-muted">Phải nhập 5 ký tự, in hoa....</div>
      </div>

      <!-- Địa chỉ -->
      <div class="mb-3">
        <label for="address" class="form-label text-secondary">Địa chỉ</label>
        <input type="text" class="form-control" id="address">
        <div class="form-text text-muted">Phải nhập 5 ký tự, in hoa....</div>
      </div>

      <!-- Đi từ & Đến (Hàng 2 cột) -->
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="fromCity" class="form-label text-secondary">Đi từ</label>
          <select class="form-select" id="fromCity">
            <option selected>Hà nội</option>
            <option value="1">TP. Hồ Chí Minh</option>
            <option value="2">Đà Nẵng</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="toCity" class="form-label text-secondary">Đến</label>
          <select class="form-select" id="toCity">
            <option selected>Hà nội</option>
            <option value="1">TP. Hồ Chí Minh</option>
            <option value="2">Đà Nẵng</option>
          </select>
        </div>
      </div>

      <!-- Chọn chiều đi (Khứ hồi) -->
      <div class="mb-4">
        <label class="form-label text-secondary d-block">Chọn chiều đi (Khứ hồi)</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="checkDi">
          <label class="form-check-label text-secondary" for="checkDi">
            Đi
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="checkVe">
          <label class="form-check-label text-secondary" for="checkVe">
            Về
          </label>
        </div>
      </div>

      <!-- Nút Đặt vé -->
      <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Đặt vé</button>
    </form>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
