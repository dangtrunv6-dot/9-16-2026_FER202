<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FER202 - Exercise 9: React Components</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Style cho phần SimpleCard theo thiết kế hình chữ nhật */
    .simple-card-wrapper {
      border: 2px solid #0000ff;
      padding: 8px;
      display: flex;
      gap: 12px;
      background-color: #fff;
    }
    .card-img-box {
      border: 2px solid #c5a000;
      background-color: #fef5c7;
      min-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .card-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-title-box {
      border: 1px solid #ff6600;
      padding: 6px 12px;
      color: #e65100;
      font-size: 1.5rem;
      font-weight: 500;
    }
    .card-desc-box {
      border: 1px solid #777;
      border-top: none;
      padding: 8px 12px;
      color: #555;
      flex: 1;
    }
  </style>
</head>
<body class="bg-light">

  <div id="root"></div>

  <!-- Mã nguồn React JSX -->
  <script type="text/babel">

    // 1. Component "Hello, World!"
    function HelloWorld() {
      return <h5>Hello, World!</h5>;
    }

    // 2. Component giới thiệu bản thân
    function AboutMe({ name, bio }) {
      return (
        <div class="alert alert-info mb-0">
          <strong className="fs-5">{name}</strong>
          <p className="mb-0 mt-1">{bio}</p>
        </div>
      );
    }

    // 3. Component Counter Application (Tăng / Giảm)
    function Counter() {
      const [count, setCount] = React.useState(0);

      return (
        <div className="d-flex align-items-center gap-3">
          <button className="btn btn-outline-danger px-3" onClick={() => setCount(count - 1)}>-</button>
          <span className="fs-4 fw-bold px-2">{count}</span>
          <button className="btn btn-outline-success px-3" onClick={() => setCount(count + 1)}>+</button>
        </div>
      );
    }

    // 4. Các Component nhỏ của SimpleCard (Leaf nodes)
    function Image({ url }) {
      return (
        <div className="card-img-container">
          {url ? <img src={url} alt="Card" style={{ maxHeight: '60px' }} /> : <h3 className="m-0 text-warning font-monospace fw-bold">IMG</h3>}
        </div>
      );
    }

    function Title({ text }) {
      return <div className="card-title-box">{text}</div>;
    }

    function Description({ text }) {
      return <div className="card-desc-box">{text}</div>;
    }

    // Wrapper Component cho SimpleCard
    function SimpleCard({ item }) {
      return (
        <div className="simple-card-wrapper">
          <div className="card-img-box">
            <Image url={item.imageUrl} />
          </div>
          <div className="card-content-box">
            <Title text={item.title} />
            <Description text={item.description} />
          </div>
        </div>
      );
    }

    // 5. Component Simple Website
    function SimpleWebsite() {
      return (
        <div className="border rounded overflow-hidden">
          {/* Header */}
          <div className="text-center py-4" style={{ backgroundColor: '#e67e22' }}>
            <div className="bg-white d-inline-block px-4 py-2 rounded mb-3">
              <h4 className="m-0 text-primary fw-bold">FPT <span className="text-warning">Education</span></h4>
              <h5 className="m-0 text-danger fw-bold">FPT UNIVERSITY</h5>
            </div>
            <nav className="d-flex justify-content-center gap-4 text-white">
              <a href="#" className="text-white text-decoration-none">Home</a>
              <a href="#" className="text-white text-decoration-none">About</a>
              <a href="#" className="text-white text-decoration-none">Contact</a>
            </nav>
          </div>

          {/* Body */}
          <div className="bg-white text-center py-5">
            <h3 className="fw-bold">About</h3>
            <p class="text-secondary mb-4">This is the about section of the website.</p>

            <h3 className="fw-bold">Contact</h3>
            <p className="text-secondary mb-0">For any inquiries, please contact us at example@example.com.</p>
          </div>

          {/* Footer */}
          <div className="text-center py-3 text-white" style={{ backgroundColor: '#f39c12' }}>
            <p className="m-0 small">&copy; 2023 Website. All rights reserved.</p>
          </div>
        </div>
      );
    }

    // App chính chứa toàn bộ các bài tập
    function App() {
      const cardData = {
        title: "A Title",
        description: "The description goes here.",
        imageUrl: "" // Để trống để hiển thị chữ "IMG" chuẩn như đề bài
      };

      const cardDataFpt = {
        title: "Hoai Nguyen - FPT DaNang",
        description: "Moblie: 0982827763",
        imageUrl: ""
      };

      return (
        <div className="container py-4" style={{ maxWidth: '850px' }}>
          <h2 className="text-primary mb-4 border-bottom pb-2">Exercise 9: React Components</h2>

          {/* Part 1 & 2 */}
          <div className="card mb-4 shadow-sm">
            <div className="card-header fw-bold bg-white">1. Hello World & About Me</div>
            <div className="card-body">
              <HelloWorld />
              <hr />
              <AboutMe name="TrungDT" bio="Sinh viên FPT University - Đang học lập trình Web với React & Bootstrap." />
            </div>
          </div>

          {/* Part 3 */}
          <div className="card mb-4 shadow-sm">
            <div className="card-header fw-bold bg-white">2. Counter Application</div>
            <div className="card-body">
              <Counter />
            </div>
          </div>

          {/* Part 4 */}
          <div className="card mb-4 shadow-sm">
            <div className="card-header fw-bold bg-white">3. Create Simple Card</div>
            <div className="card-body d-flex flex-column gap-3">
              <SimpleCard item={cardData} />
            </div>
          </div>

          {/* Part 5 */}
          <div className="card mb-4 shadow-sm">
            <div className="card-header fw-bold bg-white">4. Create Simple Website</div>
            <div className="card-body">
              <SimpleWebsite />
            </div>
          </div>

        </div>
      );
    }

    // Render App vào HTML
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
